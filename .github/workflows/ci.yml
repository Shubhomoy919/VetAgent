name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest on SQLite and Postgres, migrations, seed)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LLM_PROVIDER: demo
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Vercel entry point imports cleanly
        run: python -c "import runpy; app = runpy.run_path('api/index.py')['app']; print(type(app).__name__, 'OK')"

      - name: Seed data matches benchmark v1.0.0
        working-directory: backend
        run: python -m app.scripts.benchmark --files --check

      - name: Frozen snapshot reproduces
        working-directory: backend
        run: python -m app.scripts.snapshot verify

      - name: pytest (SQLite)
        working-directory: backend
        run: python -m pytest -q

      - name: pytest (Postgres)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vab_test
        run: python -m pytest -q

      - name: Migrations and seed on a fresh Postgres database (twice)
        working-directory: backend
        env:
          PGPASSWORD: postgres
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vab_seed
          DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/vab_seed
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE vab_seed"
          alembic upgrade head
          python -m app.scripts.seed --skip-svtg
          python -m app.scripts.seed --skip-svtg
          python -m app.scripts.benchmark --check

  frontend:
    name: Frontend (tsc, lint, checks, build, secrets scan)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Style, contrast and motion checks
        run: |
          npm run check:style
          npm run check:contrast
          npm run check:motion

      - name: Production build
        run: npm run build

      - name: No secrets in the built frontend
        run: npm run check:secrets
