name: Bug report
description: Something in the app, the API or the scoring does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Research prototype, not for clinical use. Do not include API keys, access codes or personal data.
        Security problems: please report them privately (see SECURITY.md), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Bench
        2. Select BOV-WD-007
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The `version` and `benchmark.short_hash` from `/api/health`, or the commit.
      placeholder: 1.0.0, benchmark b4b15a693070
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Local development (npm run dev)
        - Local production build (uvicorn app.main:app)
        - A deployed site
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and OS
      placeholder: Chrome 140, Windows 11
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Error text from the page or the server log. Remove any keys or codes first.
      render: text
