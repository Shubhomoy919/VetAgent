<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VetAgentBench-IN — research prototype, not for clinical use." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>VetAgentBench-IN</title>
    <script>
      // Apply the saved theme (default Cyanotype) before first paint to avoid a flash.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("vab.theme");
        } catch (e) {
          theme = null;
        }
        if (theme === "light") theme = "bone-block";
        if (theme !== "cyanotype" && theme !== "bone-block" && theme !== "kalamkari") theme = "cyanotype";
        document.documentElement.dataset.theme = theme;
        var density = null;
        try {
          density = localStorage.getItem("vab.density");
        } catch (e) {
          density = null;
        }
        document.documentElement.dataset.density = density === "compact" ? "compact" : "comfortable";
        var ledger = null;
        try {
          ledger = localStorage.getItem("vab.ledger");
        } catch (e) {
          ledger = null;
        }
        document.documentElement.dataset.ledger = ledger === "dense" ? "dense" : "comfortable";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
