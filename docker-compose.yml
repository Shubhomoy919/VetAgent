# Local test of the production container.
#   cp .env.production.example .env.production   # then fill in ADMIN_ACCESS_CODE, SESSION_SECRET, GEMINI_API_KEY
#   docker compose up --build
#   open http://localhost:8000
services:
  vetagentbench:
    build: .
    image: vetagentbench:1.0.0
    env_file: .env.production
    environment:
      # Plain http on localhost: browsers still send Secure cookies to localhost, scripts may not.
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      SVTG_PDF_PATH: /svtg/StandardVeterinaryTreatment.pdf
    ports:
      - "8000:8000"
    volumes:
      - vab-data:/data
      # The SVTG PDF stays on the server, mounted read-only from your machine.
      - ./data/StandardVeterinaryTreatment.pdf:/svtg/StandardVeterinaryTreatment.pdf:ro
    stop_grace_period: 40s
    restart: unless-stopped

volumes:
  vab-data:
